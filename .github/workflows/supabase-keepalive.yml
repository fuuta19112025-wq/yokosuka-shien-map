name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 3 * * 1,4" # 毎週月・木 12:00 JST(UTC 3:00)に実行
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent free-tier auto-pause
        run: |
          curl -sS -o /dev/null -w "status: %{http_code}\n" \
            -X PATCH \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"pinged_at": "now"}'
